const songs=[{"title": "Caminar en misión (demostración)", "page": "demo", "body": "DO                 SOL\nCaminamos compartiendo,\nlam                FA\nuna luz en el corazón.\nDO                 SOL\nCada voz se hace camino,\nFA        SOL       DO\ny la música es unión."}, {"title": "Juntos en comunidad (demostración)", "page": "demo", "body": "SOL             RE\nEn la mesa hay un lugar,\nmim              DO\npara escuchar y compartir.\nSOL              RE\nCada paso es un cantar,\nDO       RE       SOL\ny un motivo para servir."}];
let mode='home',current=-1,size=15,query='';let favs=[],celebration=[];try{favs=JSON.parse(localStorage.getItem('cm_favs')||'[]');celebration=JSON.parse(localStorage.getItem('cm_cel')||'[]')}catch(e){}const main=document.getElementById('main');const home=main.innerHTML;function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem('cm_favs',JSON.stringify(favs));localStorage.setItem('cm_cel',JSON.stringify(celebration))}catch(e){}}function show(m){mode=m;current=-1;query='';render()}function searchNow(t){mode='songs';query=t;render()}function openSong(i){current=i;render()}function toggle(i,type){let arr=type==='fav'?favs:celebration;let ix=arr.indexOf(i);if(ix<0)arr.push(i);else arr.splice(ix,1);save();render()}function render(){for(let b of document.querySelectorAll('.nav button'))b.classList.remove('active');let navmode=mode==='home'?'home':mode==='favs'?'favs':mode==='celebration'?'celebration':'songs';document.getElementById('n-'+navmode).classList.add('active');if(current>=0){let s=songs[current];main.innerHTML=`<button class="back" onclick="current=-1;render()">← Volver</button><h2>${esc(s.title)}</h2><p class="muted">Canción original de demostración</p><button class="action" onclick="toggle(${current},'fav')">${favs.includes(current)?'♥ Favorita':'♡ Favorito'}</button><button class="action" onclick="toggle(${current},'cel')">${celebration.includes(current)?'✓ En celebración':'+ Celebración'}</button><button class="action" onclick="size=Math.max(12,size-2);render()">A−</button><button class="action" onclick="size=Math.min(27,size+2);render()">A+</button><div class="lyrics" style="font-size:${size}px">${esc(s.body)}</div><p class="hint">Los acordes de esta demostración se muestran en formato monoespaciado.</p>`;return}if(mode==='home'){main.innerHTML=home;return}let ids=mode==='favs'?favs:mode==='celebration'?celebration:songs.map((s,i)=>i);let label=mode==='favs'?'Favoritos':mode==='celebration'?'Mi celebración':mode==='claret'?'Posiciones claretianas':mode==='prayer'?'Canciones de oración':'Cancionero claretiano';let results=ids.filter(i=>songs[i].title.toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')));main.innerHTML=`<h2>${label}</h2><input class="search" placeholder="Buscar por título…" value="${esc(query)}" oninput="query=this.value;renderList()"><div id="list"></div><p class="hint">Versión de prueba con canciones originales de demostración. Antes de publicar otros cancioneros revisaremos los permisos.</p>`;renderList()}function renderList(){let list=document.getElementById('list');if(!list)return;let ids=mode==='favs'?favs:mode==='celebration'?celebration:songs.map((s,i)=>i);list.innerHTML=ids.filter(i=>songs[i].title.toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es'))).map(i=>`<div class="song"><button class="open" onclick="openSong(${i})">${esc(songs[i].title)}<div class="muted">Letra y acordes · prueba</div></button><button onclick="toggle(${i},'fav')">${favs.includes(i)?'♥':'♡'}</button></div>`).join('')||'<div class="empty">No hay canciones en esta sección todavía.</div>'}render();</script></body></html>
